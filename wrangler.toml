# Cloudflare Pages / Workers Configuration
name = "anhkhaishop"
pages_build_output_dir = "."

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "shoplite-products"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "anhkhaishop-db"
database_id = "f6861451-7895-4811-8c96-19e0179d178a"

# Cloudflare R2 Image Storage Bucket Binding
[[r2_buckets]]
binding = "MY_R2_BUCKET"
bucket_name = "anhkhaishop-images"
